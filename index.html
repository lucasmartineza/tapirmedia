<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tapir Media</title>
<meta name="description" content="Foto y video de carreras. Eventos, galería y clips.">
<meta property="og:title" content="Tapir Media">
<meta property="og:description" content="Foto y video de carreras. Eventos, galería y clips.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tapir Media">
<meta property="og:image" content="https://lucasmartineza.github.io/tapirmedia/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:url" content="https://lucasmartineza.github.io/tapirmedia/">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;1,700&family=Barlow:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1F1C19; --panel:#1C1916; --tile:#2E2925; --text:#EEE9E4; --muted:#B3AAA2;
  --c:#5CE6FF; --c-rgb:92,230,255; --on-c:#24201D;
  --line:rgba(var(--c-rgb),.28); --line-soft:rgba(var(--c-rgb),.18);
  --cond:'Barlow Condensed',sans-serif; --mono:'JetBrains Mono',monospace;
  --wrap:1280px; --pad:32px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(to right,rgba(var(--c-rgb),.04) 1px,transparent 1px);background-size:calc((min(100vw,1280px) - 64px + 24px) / 12) 100%;background-position:center top;color:var(--text);font-family:Barlow,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
a{color:var(--muted);text-decoration:none}a:hover{color:var(--c)}
button{font-family:inherit;color:inherit}
img{display:block}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad)}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.14em}
.kick{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--c)}
.h1{margin:0;font-family:var(--cond);font-style:italic;font-weight:700;font-size:64px;line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.tile{background-color:var(--tile);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 1px,transparent 1px 12px)}
.glow{box-shadow:0 0 0 1px var(--c),0 0 16px rgba(var(--c-rgb),.55),0 0 44px rgba(var(--c-rgb),.22);transition:box-shadow .2s,transform .2s}
.glow:hover{box-shadow:0 0 0 1px var(--c),0 0 24px rgba(var(--c-rgb),.85),0 0 70px rgba(var(--c-rgb),.38);transform:translateY(-1px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:52px;padding:0 28px;border:0;background:var(--c);color:var(--on-c);font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.22em;cursor:pointer}
a.btn,a.btn:hover{color:var(--on-c)}
.ghost{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 18px;border:0;background:none;color:var(--text);box-shadow:0 0 0 1px rgba(var(--c-rgb),.4);font-family:var(--cond);font-weight:500;font-size:14px;letter-spacing:.2em;cursor:pointer}
.ghost:hover{box-shadow:0 0 0 1px var(--c),0 0 16px rgba(var(--c-rgb),.4);color:var(--c)}

/* Animaciones y piezas de neón */
@keyframes pulse{0%{transform:translateX(-260px)}100%{transform:translateX(100vw)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes sweep{0%{transform:translateX(-120%) skewX(-18deg)}100%{transform:translateX(320%) skewX(-18deg)}}
.rail{position:relative;height:1px;background:var(--line);overflow:hidden}
.rail i{position:absolute;top:-1px;left:0;width:220px;height:3px;background:linear-gradient(90deg,transparent,var(--c),transparent);box-shadow:0 0 12px var(--c);animation:pulse 5.5s linear infinite}
.cut{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.cta{box-shadow:0 0 18px rgba(var(--c-rgb),.55),0 0 50px rgba(var(--c-rgb),.25);transition:box-shadow .2s,transform .2s,filter .2s}
.cta:hover{filter:drop-shadow(0 0 14px rgba(var(--c-rgb),.8));transform:translateY(-1px)}
.speed{display:flex;gap:6px}
.speed b{display:block;width:26px;height:3px;background:var(--c);transform:skewX(-35deg);box-shadow:0 0 8px rgba(var(--c-rgb),.8)}
.speed b:nth-child(2){width:18px;opacity:.7}.speed b:nth-child(3){width:10px;opacity:.45}
.live{animation:blink 1.6s ease-in-out infinite}
.sep{display:flex;align-items:center;gap:20px}
.sep span{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--c)}
.sep i{flex:1;height:1px;background:linear-gradient(90deg,var(--c),rgba(var(--c-rgb),.12));box-shadow:0 0 8px rgba(var(--c-rgb),.6)}
.sep em{width:9px;height:9px;border:1px solid var(--c);transform:rotate(45deg)}
.it{font-family:var(--cond);font-style:italic;font-weight:700;letter-spacing:.01em;text-transform:uppercase}
.neon{color:var(--c);text-shadow:0 0 18px rgba(var(--c-rgb),.6)}
.outline{color:transparent;-webkit-text-stroke:1px var(--c);text-shadow:0 0 24px rgba(var(--c-rgb),.35)}

/* Header */
.tele .wrap{height:32px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);white-space:nowrap;overflow:hidden}
.tele .dot{display:inline-block;width:6px;height:6px;margin-right:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);vertical-align:1px}
.top{position:sticky;top:0;z-index:20;background:rgba(31,28,25,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{height:96px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{flex:none;display:flex;align-items:center;gap:12px;color:var(--text)}
.brand:hover{color:var(--text)}
.brand .mk{display:none}
.brand .nm{font-family:var(--cond);font-style:italic;font-weight:700;font-size:30px;letter-spacing:.02em}
.brand .nm em{font-style:inherit;color:var(--c);text-shadow:0 0 14px rgba(var(--c-rgb),.7)}
.brand img.full{height:54px;max-height:none;width:auto;max-width:280px}
.brand img{max-height:54px}
.brand .ico{height:36px;width:36px;object-fit:contain}
.brand.both .ico{display:none}
.nav{flex:none;display:flex;align-items:center;gap:36px;font-family:var(--cond);font-weight:500;font-size:15px;letter-spacing:.24em}
.nav .nl{position:relative;padding:8px 0}
.nav .nl small{margin-right:8px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--c)}
.nav .nl::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1px;background:var(--c);box-shadow:0 0 8px var(--c);transition:right .3s}
.nav .nl:hover::after,.nav .nl[aria-current]::after{right:0}
.nav a[aria-current]{color:var(--c)}
.nav .btn{height:46px;padding:0 26px;font-size:15px}

/* Logos de campeonatos */
.hlogos{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:space-evenly;gap:22px;padding:0 28px}
.hlogos img{flex:0 1 auto;min-width:0;height:36px;width:auto;max-width:104px;object-fit:contain;opacity:.9;transition:opacity .2s;mix-blend-mode:screen}
.hlogos img:hover{opacity:1}
.hlogos:empty{display:none}
.ruler{height:8px;background-image:linear-gradient(to right,rgba(var(--c-rgb),.5) 1px,transparent 1px);background-size:16px 100%}

/* Portada: apartados */
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:56px 0 104px}
.door{position:relative;display:block;height:520px;color:var(--text)}
.door:hover{color:var(--text)}
.door .ph{position:absolute;inset:0;overflow:hidden;clip-path:polygon(0 0,calc(100% - 36px) 0,100% 36px,100% 100%,36px 100%,0 calc(100% - 36px))}
.door .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.door:hover .bgimg{transform:scale(1.03)}
.door .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,18,16,.88) 0,rgba(20,18,16,.35) 45%,rgba(20,18,16,0) 70%)}
.door .ph::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(var(--c-rgb),.22),transparent);transform:translateX(-120%) skewX(-18deg)}
.door:hover .ph::after{animation:sweep .9s ease-out}
.door svg.edge{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.door svg.edge polygon{fill:none;stroke:rgba(var(--c-rgb),.55);stroke-width:1;vector-effect:non-scaling-stroke;transition:stroke .2s,filter .2s}
.door:hover svg.edge polygon{stroke:var(--c);filter:drop-shadow(0 0 6px var(--c)) drop-shadow(0 0 16px rgba(var(--c-rgb),.6))}
.door .in{position:absolute;inset:0;padding:28px 32px;display:flex;flex-direction:column;justify-content:space-between}
.door .tp{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--c);text-shadow:0 1px 8px rgba(0,0,0,.6)}
.door .bt{display:flex;flex-direction:column;gap:12px}
.door .big{font-family:var(--cond);font-style:italic;font-weight:700;font-size:150px;line-height:.8;color:transparent;-webkit-text-stroke:1px rgba(var(--c-rgb),.65);transition:-webkit-text-stroke-color .2s,text-shadow .2s}
.door:hover .big{-webkit-text-stroke-color:var(--c);text-shadow:0 0 22px rgba(var(--c-rgb),.45)}
.door .lbl{font-family:var(--cond);font-weight:500;font-size:56px;line-height:1;letter-spacing:.06em;text-shadow:0 1px 14px rgba(0,0,0,.6);transition:color .2s,text-shadow .2s}
.door:hover .lbl{color:var(--c);text-shadow:0 0 18px rgba(var(--c-rgb),.6)}
.door .sub{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid rgba(var(--c-rgb),.35);font-size:15px;color:#D6CFC8}
.door .sub b{font-weight:400;font-family:var(--mono);color:var(--c)}

/* Tapirteam */
.bio .wrap{padding-top:56px;padding-bottom:104px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;row-gap:48px}
.bio .ttl{grid-column:1 / -1;margin:0 0 -16px}
.bio .txt{grid-column:1 / span 5;align-self:start;display:flex;flex-direction:column}
.bio .ttl h2{margin:0;font-size:64px;line-height:.9}
.bio .txt .lead{display:flex;flex-direction:column;justify-content:space-between;gap:.8em;height:100%}
.bio .txt .lead p{margin:0;line-height:1.55;color:var(--muted)}
.bio .txt .lead p:first-child{font-family:var(--cond);font-weight:500;font-size:1.5em;line-height:1.15;letter-spacing:.03em;color:var(--text)}
.bio .txt .lead{font-size:15px}
.bio .txt .lead p{font-size:1em}
.team{grid-column:7 / span 6;align-self:start;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.member{display:flex;flex-direction:column;gap:14px}
.member .fr{position:relative}
.member .pic{aspect-ratio:4/5;overflow:hidden;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.member .pic img{width:100%;height:100%;object-fit:cover}
.member svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.member polyline{fill:none;stroke:var(--c);stroke-width:1.5;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 5px var(--c))}
.member .id{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.member h3{margin:0;font-family:var(--cond);font-weight:500;font-size:20px;letter-spacing:.08em;text-transform:uppercase;overflow-wrap:anywhere}
.member h3.hd{font-family:var(--mono);font-weight:400;font-size:12px;letter-spacing:.02em;text-transform:none;color:var(--c)}
.member .hn{font-family:var(--mono);font-size:12px;color:var(--c)}
.member .cd{flex:none;font-family:var(--mono);font-size:10px;color:var(--muted)}

/* 10 datos */
.facts{padding:0 0 104px}
.fpanel{position:relative;border:1px solid rgba(var(--c-rgb),.35);background:rgba(14,12,11,.55);box-shadow:inset 0 0 60px rgba(var(--c-rgb),.06),0 0 30px rgba(var(--c-rgb),.08)}
.fpanel .k1,.fpanel .k2{position:absolute;width:22px;height:22px;border:0 solid var(--c)}
.fpanel .k1{top:-1px;left:-1px;border-top-width:2px;border-left-width:2px}.fpanel .k2{bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px}
.fpanel .fh{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 28px;border-bottom:1px solid rgba(var(--c-rgb),.22);font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.fpanel .fh b{font-weight:400;color:var(--c)}.fpanel .fh span{color:var(--muted)}
.fpanel .fb{display:flex;flex-wrap:wrap;align-items:center;gap:32px;padding:36px 28px}
.fpanel .fn{flex:none;width:120px;font-family:var(--cond);font-style:italic;font-weight:700;font-size:110px;line-height:.8}
.facts .ft{flex:1 1 480px;min-width:0;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:12px;transition:opacity .35s}
.facts .ft h3{margin:0;font-family:var(--cond);font-weight:500;font-size:34px;line-height:1.05;letter-spacing:.04em;text-transform:uppercase}
.facts .ft p{margin:0;max-width:760px;font-size:18px;line-height:1.55;color:var(--muted)}
.facts .ctl{flex:none;display:flex;gap:12px}
.facts .ctl button{width:48px;height:48px;border:0;background:rgba(var(--c-rgb),.12);color:var(--c);font-size:20px;cursor:pointer;transition:background .2s}
.facts .ctl button:hover{background:rgba(var(--c-rgb),.25)}
.facts .segs{display:grid;gap:8px;padding:0 28px 24px}
.facts .segs i{height:4px;transform:skewX(-30deg);background:rgba(var(--c-rgb),.14);transition:background .3s,box-shadow .3s}
.facts .segs i.past{background:rgba(var(--c-rgb),.55)}
.facts .segs i.on{background:var(--c);box-shadow:0 0 10px var(--c)}
.facts .end{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 32px;padding:16px 28px;border-top:1px solid rgba(var(--c-rgb),.22)}
.facts .end b{font-weight:400;font-family:var(--cond);font-size:20px;letter-spacing:.04em}
.facts .end small{max-width:460px;font-size:12px;line-height:1.5;color:var(--muted)}

/* Contacto */
.contact{border-top:1px solid var(--line);background-color:#171512;background-image:repeating-linear-gradient(-55deg,rgba(var(--c-rgb),.035) 0 1px,transparent 1px 22px)}
.contact .wrap{padding-top:104px;padding-bottom:104px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;row-gap:40px;align-items:end}
.contact .l{grid-column:1 / span 7;display:flex;flex-direction:column;gap:28px}
.contact h2{margin:0;font-size:76px;line-height:.9}
.contact dl{margin:0;display:grid;grid-template-columns:130px 1fr;row-gap:14px;font-size:16px}
.contact dt{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);align-self:center}
.contact dd{margin:0}
.contact dd a{color:var(--text)}.contact dd a:hover{color:var(--c)}
.contact .r{grid-column:8 / span 5}
.contact .r .btn{width:100%;height:84px;justify-content:space-between;padding:0 32px;font-size:20px;white-space:nowrap}
.contact .r .btn .speed b{background:var(--on-c);box-shadow:none}

.foot .wrap{padding-top:28px;padding-bottom:28px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted)}

/* Galería y clips */
.phead{border-bottom:1px solid var(--line)}
.phead .wrap{padding-top:64px;padding-bottom:32px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:24px}
.phead .mono{color:var(--muted)}
.albums{display:flex;gap:8px;overflow-x:auto;padding:24px 0 0}
.albums button{flex:none}
.albums button[aria-pressed="true"]{background:var(--c);color:var(--on-c);box-shadow:0 0 0 1px var(--c),0 0 16px rgba(var(--c-rgb),.5)}
.masonry{columns:3 320px;column-gap:16px;padding:32px 0 96px}
.shot{display:block;width:100%;margin:0 0 16px;padding:0;border:0;background:var(--tile);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);cursor:zoom-in;break-inside:avoid;position:relative;box-shadow:0 0 0 1px var(--line-soft);transition:box-shadow .2s}
.shot:hover{box-shadow:0 0 0 1px var(--c),0 0 26px rgba(var(--c-rgb),.35)}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .by{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text);text-shadow:0 1px 6px rgba(0,0,0,.7);opacity:0;transition:opacity .2s}
.shot:hover .by{opacity:1}
.empty{padding:80px 0;font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--muted);line-height:1.8}

.player{display:flex;flex-direction:column;gap:16px;padding:40px 0 48px}
.screen{position:relative;aspect-ratio:16/9;border:1px solid rgba(var(--c-rgb),.45);box-shadow:0 0 40px rgba(var(--c-rgb),.12);background:#000}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.screen .corner{position:absolute;width:20px;height:20px;border:0 solid var(--c);pointer-events:none;z-index:2}
.c1{top:-1px;left:-1px;border-top-width:2px!important;border-left-width:2px!important}
.c2{top:-1px;right:-1px;border-top-width:2px!important;border-right-width:2px!important}
.c3{bottom:-1px;left:-1px;border-bottom-width:2px!important;border-left-width:2px!important}
.c4{bottom:-1px;right:-1px;border-bottom-width:2px!important;border-right-width:2px!important}
.screen .poster{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer}
.screen .poster img{width:100%;height:100%;object-fit:cover;opacity:.75}
.screen .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:88px;height:88px;border-radius:50%;background:rgba(36,32,29,.6);color:var(--c);display:flex;align-items:center;justify-content:center}
.ptitle{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:16px}
.ptitle h2{margin:0;font-family:var(--cond);font-weight:500;font-size:32px;letter-spacing:.06em;text-transform:uppercase}
.ptitle span{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--c)}
.clips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:24px 0 96px;border-top:1px solid var(--line)}
.clip{display:flex;flex-direction:column;gap:12px;padding:0;border:0;background:none;color:var(--text);text-align:left;cursor:pointer}
.clip .th{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;box-shadow:0 0 0 1px var(--line-soft);transition:box-shadow .2s}
.clip .th img{width:100%;height:100%;object-fit:cover}
.clip:hover .th,.clip[aria-pressed="true"] .th{box-shadow:0 0 0 2px var(--c),0 0 20px rgba(var(--c-rgb),.45)}
.clip .pl{position:absolute;left:12px;top:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--c);background:rgba(36,32,29,.5);display:flex;align-items:center;justify-content:center;color:var(--c)}
.clip .du{position:absolute;right:12px;bottom:10px;font-family:var(--mono);font-size:11px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.clip .tt{font-family:var(--cond);font-weight:500;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.clip .mt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}

/* Visor */
.lb{position:fixed;inset:0;z-index:60;background:rgba(20,18,16,.97);display:flex;flex-direction:column}
.lb .bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px var(--pad);font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted)}
.lb .bar .acts{display:flex;gap:12px;align-items:center}
.lb .x{width:44px;height:44px;border:0;background:none;color:var(--text);font-size:24px;cursor:pointer}
.lb .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 72px 32px;position:relative}
.lb .stage img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 0 0 1px var(--line)}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;border:0;background:none;color:var(--c);font-size:30px;cursor:pointer}
.lb .pv{left:12px}.lb .nx{right:12px}

@media (max-width:1240px){
  .top .wrap{flex-wrap:wrap;height:auto;padding-top:14px;padding-bottom:0;row-gap:0}
  .hlogos{order:3;flex-basis:100%;height:64px;margin-top:12px;border-top:1px solid var(--line-soft);padding:0;justify-content:space-between}
}
@media (max-width:900px){
  :root{--pad:20px}
  .nav .nl{display:none}
  .brand .nm{font-size:15px;letter-spacing:.24em;white-space:nowrap}
  .brand.both .ico{display:block}
  .brand.both .full{display:none}
  .nav .btn{height:40px;padding:0 16px;font-size:13px}
  .brand .nm{font-size:24px;letter-spacing:.02em}
  .top .wrap{height:auto;min-height:64px;padding-top:10px}
  .tele .wrap>span:last-child{display:none}
  .doors{grid-template-columns:1fr;gap:14px;padding:18px 0 48px}
  .door{height:220px}
  .door .in{padding:16px 20px}
  .door .big{font-size:72px}
  .door .lbl{font-size:36px}
  .door .sub{display:none}
  .hlogos{height:52px;gap:14px}
  .hlogos img{height:26px;max-width:84px}
  .brand img.full{height:40px}
  .bio .wrap,.contact .wrap{grid-template-columns:1fr;padding-top:48px;padding-bottom:56px}
  .bio .txt,.team,.contact .l,.contact .r{grid-column:1 / -1}
  .bio .txt h2{font-size:48px}
  .team{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .member h3{font-size:15px}
  .fpanel .fb{padding:24px 20px;gap:18px}
  .fpanel .fn{width:auto;font-size:64px}
  .facts .ft h3{font-size:24px}
  .facts .ft p{font-size:16px}
  .facts .ft{min-height:190px;flex-basis:100%}
  .fpanel .fh,.facts .end{padding-left:20px;padding-right:20px}
  .facts .segs{padding:0 20px 20px;gap:5px}
  .contact h2{font-size:48px}
  .contact .r .btn{height:68px;font-size:16px;padding:0 22px}
  .h1{font-size:44px}
  .clips{grid-template-columns:1fr}
  .masonry{columns:2 150px;column-gap:8px}
  .shot{margin-bottom:8px}
  .lb .stage{padding:0 8px 24px}
  .lb .nv{display:none}
}
</style>
</head>
<body>

<div class="tele"><div class="wrap"><span><span class="dot live"></span><span id="tele">FOTO Y VIDEO DE CARRERAS</span></span><span>FOTO + VIDEO · CÓRDOBA, ARGENTINA</span></div></div>
<div class="rail"><i></i></div>
<header class="top">
  <div class="wrap">
    <a class="brand" id="brand" href="#/"><span class="nm">TAPIR<em>MEDIA</em></span></a>
    <div class="hlogos" id="hlogos" aria-label="Campeonatos que cubrimos"></div>
    <nav class="nav" aria-label="Principal">
      <a class="nl" href="eventos/"><small>01</small>EVENTOS</a>
      <a class="nl" href="#/galeria" data-r="galeria"><small>02</small>GALERÍA</a>
      <a class="nl" href="#/clips" data-r="clips"><small>03</small>CLIPS</a>
      <a class="btn cut cta" href="#/contacto">CONTACTO</a>
    </nav>
  </div>
</header>

<main id="view"></main>

<div class="rail"><i style="animation-duration:7s"></i></div>
<footer class="foot">
  <div class="wrap"><span id="footBrand">© TAPIR MEDIA</span><span id="footHost"></span></div>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Ver foto" hidden>
  <div class="bar">
    <span id="lbInfo"></span>
    <span class="acts">
      <a class="ghost" id="lbDl" href="#" target="_blank" rel="noopener">DESCARGAR</a>
      <button class="x" id="lbClose" type="button" aria-label="Cerrar">×</button>
    </span>
  </div>
  <div class="stage">
    <button class="nv pv" id="lbPrev" type="button" aria-label="Anterior">‹</button>
    <img id="lbImg" alt="">
    <button class="nv nx" id="lbNext" type="button" aria-label="Siguiente">›</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ====== CONFIGURACIÓN ======
  // Lo ÚNICO que se toca acá: la dirección del motor (Apps Script, termina en /exec). La misma que en eventos/index.html.
  // Todo lo demás (textos, equipo, contacto, curiosidades) se edita en la planilla, pestaña "Configuración".
  var API = 'https://script.google.com/macros/s/AKfycbw82wZ04ynTFD076afLckBRGNM4Wg3KZKANYFpdZ4nXja6NGL3a1cjTu7FNbQCAXZJ_bA/exec';
  // ===========================

  var $ = function (id) { return document.getElementById(id); };
  var view = $('view');
  var SITE = {}, G = { photos: [], clips: [], team: [] }, EVENTS = [], loaded = false;
  var factTimer = null, factI = 0, lbList = [], lbI = 0, album = '', clipI = 0;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function clean(n) { return String(n || '').replace(/^\s*\d+\s*[-_.)]?\s+/, '').trim(); }
  function img(id, w) { return 'https://lh3.googleusercontent.com/d/' + id + '=w' + w; }
  function thumb(id, w) { return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + w; }
  function dl(id) { return 'https://drive.google.com/uc?export=download&id=' + id; }
  function dur(s) { s = Number(s) || 0; return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function date(t) { return t && t.length >= 8 ? t.slice(6, 8) + '/' + t.slice(4, 6) + '/' + t.slice(0, 4) : ''; }
  function phone(d) { d = String(d || ''); return /^549\d{10}$/.test(d) ? '+54 9 ' + d.slice(3, 6) + ' ' + d.slice(6, 9) + '-' + d.slice(9) : (d ? '+' + d : ''); }
  // WHATSAPP puede tener varios contactos: "Lucas | 3513020815 ; Fran | 351...". El botón usa el primero.
  function normPhone(d) {
    d = String(d || '').replace(/\D/g, '').replace(/^0+/, '');
    if (/^54/.test(d)) { if (!/^549/.test(d) && d.length === 12) d = '549' + d.slice(2); return d; }
    if (d.length === 10) return '549' + d;
    if (d.length === 11 && d.charAt(0) === '9') return '54' + d;
    return d;
  }
  function contacts() {
    return String(SITE.WHATSAPP || '').split(/\n|;|,|\//).map(function (e) {
      var m = e.match(/\+?[\d][\d\s().-]{7,}\d/);
      if (!m) return null;
      var name = e.replace(m[0], '').replace(/[|:\-–]+/g, ' ').trim();
      return { name: name, num: normPhone(m[0]) };
    }).filter(Boolean);
  }
  function wa() { var c = contacts()[0]; return c ? c.num : ''; }
  function hola() { return 'Hola' + (SITE.NOMBRE_SALUDO ? ' ' + SITE.NOMBRE_SALUDO : '') + '! '; }
  // EQUIPO acepta "Nombre | @usuario ; ..." o solo usuarios ("@uno @dos @tres"). Vacío = las fotos de _EQUIPO.
  function key(h) { return String(h || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function teamList() {
    var raw = String(SITE.EQUIPO || '').trim(), out = [];
    if (!raw) return G.team.map(function (t) { return { name: '', h: t.h, pic: t }; });
    raw.split(/\n|;/).forEach(function (row) {
      row = row.trim(); if (!row) return;
      var hs = row.match(/@[A-Za-z0-9._]+/g) || [];
      var name = row.replace(/@[A-Za-z0-9._]+/g, '').replace(/[|,]+/g, ' ').replace(/\s+/g, ' ').trim();
      if (hs.length > 1 || (!name && hs.length)) hs.forEach(function (h) { out.push({ name: '', h: h.toLowerCase() }); });
      else out.push({ name: name, h: (hs[0] || '').toLowerCase() });
    });
    out.forEach(function (m) { m.pic = m.h ? G.team.filter(function (t) { return key(t.h) === key(m.h); })[0] : null; });
    return out;
  }
  function lines(v) { return String(v || '').split(/\n|;/).map(function (x) { return x.trim(); }).filter(Boolean); }
  // Contador de visitas del panel: una por sección y por sesión, sin datos personales
  function hit(page) {
    try { if (sessionStorage.getItem('tm_hit_' + page)) return; sessionStorage.setItem('tm_hit_' + page, '1'); } catch (x) {}
    try { fetch(API + '?action=hit&p=' + encodeURIComponent(page), { mode: 'no-cors' }); } catch (x) {}
  }
  function track(name, p) { try { if (window.gtag) gtag('event', name, p || {}); } catch (x) {} }

  function api(params) {
    return fetch(API + '?' + new URLSearchParams(params).toString()).then(function (r) { return r.json(); });
  }

  // ---------- configuración del sitio ----------
  function hexRgb(h) {
    var m = String(h || '').replace('#', '').match(/^([0-9a-f]{3}|[0-9a-f]{6})$/i);
    if (!m) return null;
    var x = m[1].length === 3 ? m[1].replace(/./g, '$&$&') : m[1];
    return [parseInt(x.slice(0, 2), 16), parseInt(x.slice(2, 4), 16), parseInt(x.slice(4, 6), 16)];
  }
  // Isotipo: ícono de la pestaña y de la pantalla de inicio del celular
  function setIcon(url) {
    [['icon', 'favicon'], ['apple-touch-icon', 'appleIcon']].forEach(function (r) {
      var l = document.getElementById(r[1]);
      if (!l) { l = document.createElement('link'); l.id = r[1]; l.rel = r[0]; document.head.appendChild(l); }
      if (l.href !== url) l.href = url;
    });
    var old = document.querySelector('link[rel="icon"]:not(#favicon)'); if (old) old.remove();
  }
  // "TAPIRMEDIA" -> TAPIR + MEDIA en neón
  function brandWord(m) {
    m = String(m || '').toUpperCase().trim();
    var k = m.indexOf(' ') > 0 ? m.indexOf(' ') : (m.indexOf('MEDIA') > 0 ? m.indexOf('MEDIA') : -1);
    return k > 0 ? esc(m.slice(0, k).trim()) + '<em>' + esc(m.slice(k).trim()) + '</em>' : esc(m);
  }
  function neonTitle(t) {
    t = String(t || '').trim();
    var m = t.match(/^(TAPIR)(.+)$/i);
    return m ? esc(m[1]) + '<span class="neon">' + esc(m[2]) + '</span>' : esc(t);
  }
  function applySite(s) {
    if (!s || !s.MARCA) return;
    SITE = s;
    var root = document.documentElement.style, ac = hexRgb(s.COLOR_ACENTO), bg = hexRgb(s.COLOR_FONDO);
    if (ac && s.COLOR_ACENTO.toLowerCase() !== '#ffffff') { root.setProperty('--c', s.COLOR_ACENTO); root.setProperty('--c-rgb', ac.join(',')); }
    if (bg && s.COLOR_FONDO.toLowerCase() !== '#000000') root.setProperty('--bg', s.COLOR_FONDO);
    document.title = s.NOMBRE_VISIBLE || s.MARCA;
    var ico = s.ICON_URL ? '<img class="ico" src="' + esc(s.ICON_URL) + '" alt="' + esc(s.MARCA) + '">' : '';
    if (s.LOGO_URL) $('brand').innerHTML = '<img class="full" src="' + esc(s.LOGO_URL) + '" alt="' + esc(s.MARCA) + '">' + ico;
    else $('brand').innerHTML = ico + '<span class="nm">' + brandWord(s.MARCA) + '</span>';
    $('brand').classList.toggle('both', !!(s.LOGO_URL && s.ICON_URL));
    // El ícono de la pestaña es icon.png (archivo fijo en GitHub); no se cambia desde acá.
    $('footBrand').textContent = '© ' + s.MARCA;
    if (s.ANALYTICS_ID && !window.gtag && /^G-[A-Z0-9]+$/i.test(s.ANALYTICS_ID)) {
      var g = document.createElement('script');
      g.async = true; g.src = 'https://www.googletagmanager.com/gtag/js?id=' + s.ANALYTICS_ID;
      document.head.appendChild(g);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag('js', new Date()); gtag('config', s.ANALYTICS_ID);
    }
  }
  function setData(d) {
    if (!d || !d.site) return;
    applySite(d.site);
    G = d.gallery || G; EVENTS = d.events || [];
    $('hlogos').innerHTML = (G.logos || []).map(function (l) {
      return '<img src="' + img(l.id, 400) + '" alt="' + esc(l.n) + '" title="' + esc(l.n) + '">';
    }).join('');
    loaded = true;
  }

  // ---------- portada ----------
  function renderHome() {
    document.title = SITE.NOMBRE_VISIBLE || SITE.MARCA || 'Tapir Media';
    var ev = EVENTS[0], ph = G.photos[0], cl = G.clips[0];
    function door(n, href, label, sub, meta, bgsrc) {
      return '<a class="door" href="' + href + '"><span class="ph tile">' +
        (bgsrc ? '<img class="bgimg" loading="lazy" src="' + bgsrc + '" alt="">' : '') + '<span class="shade"></span></span>' +
        '<svg class="edge" aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="0,0 91,0 100,7 100,100 9,100 0,93"/></svg>' +
        '<span class="in"><span class="tp"><span class="speed"><b></b><b></b><b></b></span><span>' + meta + '</span></span>' +
        '<span class="bt"><span class="big">' + n + '</span><span class="lbl">' + label + '</span>' +
        '<span class="sub">' + sub + '<b>→</b></span></span></span></a>';
    }
    var team = teamList().map(function (m, k) {
      return '<article class="member"><div class="fr"><div class="pic tile">' + (m.pic ? '<img loading="lazy" src="' + img(m.pic.id, 600) + '" alt="' + esc(m.name || m.h) + '">' : '') + '</div>' +
        '<svg aria-hidden="true" viewBox="0 0 100 125" preserveAspectRatio="none"><polyline points="78,0 100,17.6 100,125"/></svg></div>' +
        (m.name ? '<h3>' + esc(m.name) + '</h3>' : '') +
        '<div class="id">' + (m.h ? '<span class="hn">' + esc(m.h) + '</span>' : '<span></span>') + '<span class="cd">T-' + String(k + 1).padStart(2, '0') + '</span></div></article>';
    }).join('');
    // CURIOSIDADES: una por renglón, "TÍTULO | texto" (el título es opcional)
    var facts = String(SITE.CURIOSIDADES || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean).map(function (x) {
      var k = x.indexOf('|');
      return k > 0 ? { t: x.slice(0, k).trim(), x: x.slice(k + 1).trim() } : { t: '', x: x };
    });
    var num = wa(), ig = String(SITE.INSTAGRAM || '').replace(/^@/, '');
    var nPh = G.photos.length, nCl = G.clips.length;
    view.innerHTML =
      '<div class="wrap"><section class="doors" aria-label="Apartados">' +
        door('01', 'eventos/', 'EVENTOS', 'Comprá tus fotos de cada fecha.', 'COMPRAR FOTOS', ev && ev.cover ? img(ev.cover, 900) : '') +
        door('02', '#/galeria', 'GALERÍA', 'Nuestras mejores fotos de carreras.', nPh + (nPh === 1 ? ' FOTO' : ' FOTOS'), ph ? img(ph.id, 900) : '') +
        door('03', '#/clips', 'CLIPS', 'Videos de carreras.', '▶ ' + nCl + (nCl === 1 ? ' CLIP' : ' CLIPS'), cl ? thumb(cl.id, 900) : '') +
      '</section></div>' +
      ((SITE.BIO_TEXTO || team) ? '<div class="wrap"><div class="sep"><span>// ' + esc(String(SITE.BIO_TITULO || 'NOSOTROS').toUpperCase()) + '</span><i></i><em></em></div></div>' +
        '<section class="bio" id="nosotros" aria-label="Nosotros"><div class="wrap">' +
        '<div class="ttl"><h2 class="it">' + neonTitle(SITE.BIO_TITULO || SITE.MARCA || '') + '</h2></div><div class="txt">' +
        (SITE.BIO_TEXTO ? '<div class="lead">' + String(SITE.BIO_TEXTO).split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean)
          .map(function (x) { return '<p>' + esc(x) + '</p>'; }).join('') + '</div>' : '') + '</div>' +
        (team ? '<div class="team">' + team + '</div>' : '') + '</div></section>' : '') +
      (facts.length ? '<section class="facts" aria-label="Curiosidades" aria-live="polite"><div class="wrap"><div class="fpanel"><span class="k1"></span><span class="k2"></span>' +
        '<div class="fh"><b>' + esc(SITE.CURIOSIDADES_TITULO || '¿Sabías que…?') + '</b><span id="fNum"></span></div>' +
        '<div class="fb"><span class="fn outline" id="fBig"></span><div class="ft" id="fBox"><h3 id="fTit"></h3><p id="fTxt"></p></div>' +
        '<div class="ctl"><button class="cut" type="button" id="fPrev" aria-label="Anterior">‹</button><button class="cut" type="button" id="fNext" aria-label="Siguiente">›</button></div></div>' +
        '<div class="segs" aria-hidden="true" style="grid-template-columns:repeat(' + facts.length + ',minmax(0,1fr))">' + facts.map(function () { return '<i></i>'; }).join('') + '</div>' +
        ((SITE.CURIOSIDADES_CIERRE || SITE.CURIOSIDADES_NOTA) ? '<div class="end">' + (SITE.CURIOSIDADES_CIERRE ? '<b>' + esc(SITE.CURIOSIDADES_CIERRE) + '</b>' : '<span></span>') +
          (SITE.CURIOSIDADES_NOTA ? '<small>' + esc(SITE.CURIOSIDADES_NOTA) + '</small>' : '') + '</div>' : '') +
        '</div></div></section>' : '') +
      '<section class="contact" id="contacto" aria-label="Contacto"><div class="wrap">' +
        '<div class="l"><span class="kick">// CONTACTO</span><h2 class="it">Contratanos para tu <span class="neon">próximo evento</span></h2><dl>' +
          contacts().map(function (c, k) {
            return '<dt>' + (k ? '' : 'WHATSAPP') + '</dt><dd><a href="https://wa.me/' + c.num + '" target="_blank" rel="noopener">' + esc(phone(c.num)) + '</a>' +
              (c.name ? ' <span style="color:var(--muted)">· ' + esc(c.name) + '</span>' : '') + '</dd>';
          }).join('') +
          (SITE.MAIL_CONTACTO ? '<dt>MAIL</dt><dd><a href="mailto:' + esc(SITE.MAIL_CONTACTO) + '">' + esc(SITE.MAIL_CONTACTO) + '</a></dd>' : '') +
          (ig ? '<dt>INSTAGRAM</dt><dd><a href="https://instagram.com/' + esc(ig) + '" target="_blank" rel="noopener">@' + esc(ig) + '</a></dd>' : '') +
        '</dl></div>' +
        (num ? '<div class="r"><a class="btn cut cta" id="waBtn" target="_blank" rel="noopener" href="https://wa.me/' + num + '?text=' +
          encodeURIComponent(hola() + 'Quiero consultar por la cobertura de un evento.') + '">ESCRIBINOS POR WHATSAPP<span class="speed"><b></b><b></b><b></b></span></a></div>' : '') +
      '</div></section>';
    if ($('tele') && ev) $('tele').textContent = 'ÚLTIMO EVENTO · ' + clean(ev.name).toUpperCase();
    if ($('waBtn')) $('waBtn').onclick = function () { track('contacto_whatsapp'); try { fetch(API + '?action=hit&p=wa', { mode: 'no-cors' }); } catch (x) {} };
    startFacts(facts);
    fitBio();
  }

  // El bloque de texto de Nosotros mide siempre lo mismo que las fotos del equipo: achica la letra hasta que entra.
  function fitBio() {
    var txt = document.querySelector('.bio .txt'), pic = document.querySelector('.bio .member .pic'), lead = document.querySelector('.bio .txt .lead');
    if (!txt || !lead) return;
    txt.style.height = ''; lead.style.fontSize = '';
    if (!pic || window.matchMedia('(max-width:900px)').matches) return;
    var h = pic.getBoundingClientRect().height;
    txt.style.height = h + 'px';
    var size = 17;
    lead.style.fontSize = size + 'px';
    while (lead.scrollHeight > h + 1 && size > 12) { size -= 0.25; lead.style.fontSize = size + 'px'; }
    if (lead.scrollHeight > h + 1) txt.style.height = '';
  }
  window.addEventListener('resize', function () { clearTimeout(fitBio.t); fitBio.t = setTimeout(fitBio, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fitBio(); });

  function startFacts(facts) {
    clearInterval(factTimer);
    if (!facts.length || !$('fTxt')) return;
    factI = factI % facts.length;
    function show(i) {
      factI = (i + facts.length) % facts.length;
      var box = $('fBox'); if (!box) return;
      box.style.opacity = 0;
      setTimeout(function () {
        if (!$('fBox')) return;
        var f = facts[factI], n = String(factI + 1).padStart(2, '0');
        $('fTit').textContent = f.t;
        $('fTit').hidden = !f.t;
        $('fTxt').textContent = f.x;
        box.style.opacity = 1;
        $('fNum').textContent = n + ' / ' + String(facts.length).padStart(2, '0');
        if ($('fBig')) $('fBig').textContent = n;
        document.querySelectorAll('.facts .segs i').forEach(function (t, k) { t.className = k < factI ? 'past' : k === factI ? 'on' : ''; });
        document.querySelectorAll('.facts .ticks i').forEach(function (t, k) { t.className = k === factI ? 'on' : ''; });
      }, 200);
    }
    function restart() { clearInterval(factTimer); factTimer = setInterval(function () { show(factI + 1); }, 9000); }
    $('fPrev').onclick = function () { show(factI - 1); restart(); };
    $('fNext').onclick = function () { show(factI + 1); restart(); };
    show(factI); restart();
  }

  // ---------- galería ----------
  function renderGallery() {
    document.title = 'Galería · ' + (SITE.NOMBRE_VISIBLE || SITE.MARCA || 'Tapir Media');
    var albums = [];
    G.photos.forEach(function (p) { if (p.a && albums.indexOf(p.a) < 0) albums.push(p.a); });
    var list = G.photos.filter(function (p) { return !album || p.a === album; });
    lbList = list;
    view.innerHTML =
      '<section class="phead"><div class="wrap"><h1 class="h1">Galería</h1><span class="mono">' + list.length + (list.length === 1 ? ' FOTO' : ' FOTOS') + ' · MÁS NUEVAS PRIMERO</span></div></section>' +
      '<div class="wrap">' +
      (albums.length ? '<div class="albums">' + ['', ].concat(albums).map(function (a) {
        return '<button class="ghost" type="button" data-album="' + esc(a) + '" aria-pressed="' + (a === album) + '">' + esc(a ? clean(a).toUpperCase() : 'TODAS') + '</button>';
      }).join('') + '</div>' : '') +
      (list.length ? '<div class="masonry">' + list.map(function (p, i) {
        var ratio = p.w && p.h ? ' style="aspect-ratio:' + p.w + '/' + p.h + '"' : '';
        return '<button class="shot" type="button" data-i="' + i + '" aria-label="Ver foto' + (p.by ? ' de ' + esc(p.by) : '') + '"' + ratio + '>' +
          '<img loading="lazy" src="' + img(p.id, 900) + '" alt="">' + (p.by ? '<span class="by">' + esc(p.by) + '</span>' : '') + '</button>';
      }).join('') + '</div>'
      : '<p class="empty">' + (loaded ? 'Todavía no hay fotos en la galería.' : 'CARGANDO…') + '</p>') +
      '</div>';
  }

  function openLb(i) {
    if (!lbList.length) return;
    lbI = (i + lbList.length) % lbList.length;
    var p = lbList[lbI];
    $('lbImg').src = img(p.id, 2400);
    $('lbInfo').textContent = (lbI + 1) + ' / ' + lbList.length + (p.by ? ' · ' + p.by : '') + (date(p.t) ? ' · ' + date(p.t) : '');
    $('lbDl').href = dl(p.id);
    $('lb').hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeLb() { $('lb').hidden = true; $('lbImg').src = ''; document.body.style.overflow = ''; }

  // ---------- clips ----------
  function renderClips() {
    document.title = 'Clips · ' + (SITE.NOMBRE_VISIBLE || SITE.MARCA || 'Tapir Media');
    var list = G.clips;
    if (clipI >= list.length) clipI = 0;
    var c = list[clipI];
    view.innerHTML =
      '<section class="phead"><div class="wrap"><h1 class="h1">Clips</h1><span class="mono">' + list.length + (list.length === 1 ? ' CLIP' : ' CLIPS') + ' · MÁS NUEVOS PRIMERO</span></div></section>' +
      '<div class="wrap">' +
      (c ? '<div class="player"><div class="screen" id="screen"><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>' +
          '<button class="poster" id="poster" type="button" aria-label="Reproducir"><img src="' + thumb(c.id, 1600) + '" alt=""><span class="play glow"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg></span></button></div>' +
          '<div class="ptitle"><h2>' + esc(c.n || 'Clip') + '</h2><span>' + esc([c.by, date(c.t)].filter(Boolean).join(' · ')) + '</span></div></div>' +
        '<div class="clips">' + list.map(function (x, i) {
          return '<button class="clip" type="button" data-clip="' + i + '" aria-pressed="' + (i === clipI) + '">' +
            '<span class="th tile"><img loading="lazy" src="' + thumb(x.id, 640) + '" alt=""><span class="pl"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg></span>' +
            (x.d ? '<span class="du">' + dur(x.d) + '</span>' : '') + '</span>' +
            '<span class="tt">' + esc(x.n || 'Clip') + '</span><span class="mt">' + esc([x.by, date(x.t)].filter(Boolean).join(' · ')) + '</span></button>';
        }).join('') + '</div>'
      : '<p class="empty">' + (loaded ? 'Todavía no hay clips.' : 'CARGANDO…') + '</p>') +
      '</div>';
  }
  function playClip() {
    var c = G.clips[clipI], s = $('screen');
    if (!c || !s) return;
    var f = document.createElement('iframe');
    f.src = 'https://drive.google.com/file/d/' + c.id + '/preview';
    f.allow = 'autoplay; fullscreen';
    f.setAttribute('allowfullscreen', '');
    f.title = c.n || 'Clip';
    var p = $('poster'); if (p) p.remove();
    s.appendChild(f);
    track('ver_clip', { clip: c.n || c.id });
  }

  // ---------- rutas ----------
  function route() {
    var r = (location.hash.replace(/^#\/?/, '') || '').split('/')[0];
    closeLb();
    document.querySelectorAll('.nav a[data-r]').forEach(function (a) { if (a.getAttribute('data-r') === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    if (r !== '' && r !== 'contacto') clearInterval(factTimer);
    hit(r === 'galeria' || r === 'clips' ? r : 'home');
    if (r === 'galeria') renderGallery();
    else if (r === 'clips') renderClips();
    else {
      renderHome();
      if (r === 'contacto' && $('contacto')) { setTimeout(function () { $('contacto').scrollIntoView(); }, 30); return; }
    }
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (e) {
    var t;
    if ((t = e.target.closest('[data-i]'))) openLb(Number(t.getAttribute('data-i')));
    else if ((t = e.target.closest('[data-album]'))) { album = t.getAttribute('data-album'); renderGallery(); }
    else if ((t = e.target.closest('[data-clip]'))) { clipI = Number(t.getAttribute('data-clip')); renderClips(); playClip(); $('screen').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    else if (e.target.closest('#poster')) playClip();
  });
  $('lbClose').onclick = closeLb;
  $('lbPrev').onclick = function () { openLb(lbI - 1); };
  $('lbNext').onclick = function () { openLb(lbI + 1); };
  $('lbDl').onclick = function () { track('descarga_galeria'); };
  document.addEventListener('keydown', function (e) {
    if ($('lb').hidden) return;
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowLeft') openLb(lbI - 1);
    else if (e.key === 'ArrowRight') openLb(lbI + 1);
  });
  (function () {
    var x0 = null;
    $('lb').addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
    $('lb').addEventListener('touchend', function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 50) openLb(lbI + (dx < 0 ? 1 : -1));
    });
  })();
  window.addEventListener('hashchange', route);

  // ---------- arranque ----------
  try { setData(JSON.parse(localStorage.getItem('tm_site') || 'null')); } catch (e) {}
  route();
  api({ action: 'site' }).then(function (d) {
    if (!d || d.error) throw new Error(d && d.error);
    setData(d);
    try { localStorage.setItem('tm_site', JSON.stringify(d)); } catch (e) {}
    var y = window.scrollY, r = location.hash;
    route();
    if (r === location.hash) window.scrollTo(0, y);
  }).catch(function () {
    if (!loaded) view.innerHTML = '<div class="wrap"><p class="empty">NO PUDIMOS CARGAR EL CONTENIDO. REVISÁ TU CONEXIÓN Y RECARGÁ LA PÁGINA.</p></div>';
  });
})();
</script>
</body>
</html>
