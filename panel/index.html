<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Tapir Media</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;1,700&family=Barlow:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1F1C19; --deep:#171512; --text:#EEE9E4; --muted:#B3AAA2; --soft:#D6CFC8;
  --c:#5CE6FF; --c-rgb:92,230,255; --on-c:#1F1C19;
  --line:rgba(var(--c-rgb),.28); --line-soft:rgba(var(--c-rgb),.16);
  --cond:'Barlow Condensed',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(to right,rgba(var(--c-rgb),.04) 1px,transparent 1px);background-size:calc((min(100vw,1280px) - 64px + 24px) / 12) 100%;background-position:center top;color:var(--text);font-family:Barlow,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
a{color:var(--muted);text-decoration:none}a:hover{color:var(--c)}
button,input,textarea,select{font-family:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted)}
.kc{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--c)}
.it{font-family:var(--cond);font-style:italic;font-weight:700;letter-spacing:.01em;text-transform:uppercase}
.neon{color:var(--c);text-shadow:0 0 18px rgba(var(--c-rgb),.6)}
.cut{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.cutsm{clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px))}
@keyframes pulse{0%{transform:translateX(-260px)}100%{transform:translateX(100vw)}}
@keyframes scan{0%{background-position:-200px 0}100%{background-position:800px 0}}
@keyframes sp{to{transform:rotate(360deg)}}
.rail{position:relative;height:1px;background:var(--line);overflow:hidden}
.rail i{position:absolute;top:-1px;left:0;width:220px;height:3px;background:linear-gradient(90deg,transparent,var(--c),transparent);box-shadow:0 0 12px var(--c);animation:pulse 5.5s linear infinite}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 24px;border:0;background:var(--c);color:var(--on-c);font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.2em;cursor:pointer;filter:drop-shadow(0 0 10px rgba(var(--c-rgb),.5));transition:filter .2s}
.btn:hover{filter:drop-shadow(0 0 18px rgba(var(--c-rgb),.85));color:var(--on-c)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border:0;background:none;box-shadow:inset 0 0 0 1px rgba(var(--c-rgb),.45);color:var(--text);font-family:var(--cond);font-weight:500;font-size:14px;letter-spacing:.16em;cursor:pointer}
.ghost:hover{background:rgba(var(--c-rgb),.1);color:var(--c)}
.ghost:disabled{opacity:.45;cursor:default}
.panel{position:relative;border:1px solid var(--line);background:rgba(14,12,11,.5)}
.panel>.ph{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid rgba(var(--c-rgb),.2)}
.corner{position:absolute;top:-1px;left:-1px;width:16px;height:16px;border-top:2px solid var(--c);border-left:2px solid var(--c)}
.spin{display:inline-block;width:16px;height:16px;border:1.5px solid rgba(var(--c-rgb),.25);border-top-color:var(--c);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}

/* Header */
.top{border-bottom:1px solid var(--line);background:rgba(31,28,25,.92);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.top .wrap{height:84px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:16px;color:var(--text)}
.brand:hover{color:var(--text)}
.brand .nm{font-family:var(--cond);font-style:italic;font-weight:700;font-size:28px}
.brand .nm img.lg{display:block;height:36px;width:auto;max-width:240px}
.paper .br img{display:block;height:20px;width:auto}
.brand .nm em{font-style:inherit;color:var(--c);text-shadow:0 0 14px rgba(var(--c-rgb),.7)}
.brand .tag{padding:3px 8px;border:1px solid var(--c);font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--c)}
.tright{display:flex;align-items:center;gap:22px}
.home{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;box-shadow:inset 0 0 0 1px rgba(var(--c-rgb),.35);font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);transition:color .2s,box-shadow .2s;white-space:nowrap}
.home:hover{color:var(--c);box-shadow:inset 0 0 0 1px var(--c),0 0 12px rgba(var(--c-rgb),.35)}
.tabs{display:flex;align-items:center;gap:34px;font-family:var(--cond);font-weight:500;font-size:15px;letter-spacing:.22em}
.tabs a{position:relative;padding:8px 0}
.tabs a::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1px;background:var(--c);box-shadow:0 0 8px var(--c);transition:right .3s}
.tabs a:hover::after,.tabs a[aria-current]::after{right:0}
.tabs a[aria-current]{color:var(--c)}

main{padding:44px 0 96px}
.h1{margin:0;font-family:var(--cond);font-style:italic;font-weight:700;font-size:56px;line-height:.9;text-transform:uppercase}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:36px}
.err{margin:0;padding:12px 14px;border:1px solid rgba(255,140,120,.5);color:#ffb4a8;font-size:14px}
.ok{margin:0;padding:12px 14px;border:1px solid var(--line);color:var(--c);font-size:14px}

/* Login */
.login{min-height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;padding:48px 20px}
.login form{position:relative;width:100%;max-width:440px;padding:48px 44px 40px;border:1px solid rgba(var(--c-rgb),.4);background:rgba(14,12,11,.6);box-shadow:inset 0 0 60px rgba(var(--c-rgb),.06),0 0 40px rgba(var(--c-rgb),.1);display:flex;flex-direction:column;gap:26px}
.login .c2{position:absolute;bottom:-1px;right:-1px;width:22px;height:22px;border-bottom:2px solid var(--c);border-right:2px solid var(--c)}
.login .corner{width:22px;height:22px}

/* Campos */
.fld{width:100%;height:46px;padding:0 14px;background:var(--deep);border:1px solid rgba(var(--c-rgb),.35);color:var(--text);font-size:15px;outline:none;border-radius:0}
.fld:focus{border-color:var(--c);box-shadow:0 0 12px rgba(var(--c-rgb),.25)}
textarea.fld{height:auto;padding:12px 14px;line-height:1.55;resize:vertical}
.fld.num{font-family:var(--mono);font-size:18px}
.lbl{display:flex;flex-direction:column;gap:8px}
.busy{background-image:linear-gradient(90deg,transparent,rgba(var(--c-rgb),.18),transparent);background-size:200px 100%;background-repeat:no-repeat;animation:scan 1s linear infinite}
fieldset{margin:0;padding:24px;border:1px solid var(--line);background:rgba(14,12,11,.5);min-width:0}
legend{padding:0 8px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--c)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 16px;border:0;background:none;box-shadow:inset 0 0 0 1px rgba(var(--c-rgb),.35);color:var(--text);font-family:var(--cond);font-weight:500;font-size:15px;letter-spacing:.06em;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c);color:var(--on-c);box-shadow:none}

/* Ítems del presupuesto */
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:28px 190px minmax(0,1fr);align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgba(var(--c-rgb),.12)}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border:1px solid rgba(var(--c-rgb),.55);background:var(--deep);cursor:pointer;display:grid;place-content:center}
.item input[type=checkbox]:checked{background:var(--c);box-shadow:0 0 10px rgba(var(--c-rgb),.6)}
.item input[type=checkbox]:checked::after{content:"";width:10px;height:6px;border-left:2px solid var(--on-c);border-bottom:2px solid var(--on-c);transform:translateY(-2px) rotate(-45deg)}
.item label.n{font-family:var(--cond);font-weight:500;font-size:18px;letter-spacing:.05em;cursor:pointer}
.item .fld{height:42px}
.item.off label.n{color:var(--muted)}
.item.off .fld{opacity:.35;pointer-events:none}
@media (max-width:700px){.item{grid-template-columns:28px minmax(0,1fr)}.item .fld,.item .none{grid-column:2}}

/* Resumen */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-bottom:28px}
.kpi{padding:24px 24px 22px;display:flex;flex-direction:column;gap:14px}
.kpi b{font-family:var(--cond);font-weight:500;font-size:46px;line-height:.9}
.kpi span.n{font-family:var(--mono);font-size:11px;color:var(--c)}
.chart{height:220px;padding:24px 24px 0;display:flex;align-items:flex-end;gap:6px}
.chart i{flex:1;min-height:2px;background:rgba(var(--c-rgb),.45);transform:skewX(-12deg);transition:background .15s}
.chart i.top{background:var(--c);box-shadow:0 0 12px var(--c)}
.chart i:hover{background:var(--c)}
.axis{display:flex;justify-content:space-between;padding:10px 24px 16px;border-top:1px solid rgba(var(--c-rgb),.2);font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:7fr 5fr;gap:24px;margin-top:28px;align-items:start}
.stack{display:flex;flex-direction:column;gap:24px}
.qrow{display:grid;grid-template-columns:70px minmax(0,1fr) 130px 110px;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid rgba(var(--c-rgb),.12);color:var(--text);cursor:pointer}
.qrow:hover{background:rgba(var(--c-rgb),.05);color:var(--text)}
.qrow .cl{font-family:var(--cond);font-weight:500;font-size:18px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .ev{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .am{font-family:var(--cond);font-weight:500;font-size:20px;text-align:right}
.st{justify-self:end;padding:4px 10px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.st.enviado{box-shadow:inset 0 0 0 1px var(--c);color:var(--c)}
.st.aceptado{background:var(--c);color:var(--on-c)}
.st.borrador{box-shadow:inset 0 0 0 1px rgba(179,170,162,.5);color:var(--muted)}
.st.rechazado,.st.vencido{box-shadow:inset 0 0 0 1px rgba(179,170,162,.3);color:rgba(179,170,162,.7)}
.phrow{padding:14px 24px;border-bottom:1px solid rgba(var(--c-rgb),.12);display:flex;flex-direction:column;gap:8px}
.phrow .t{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.meter{height:4px;background:rgba(var(--c-rgb),.12);transform:skewX(-30deg)}
.meter i{display:block;height:4px;background:var(--c);box-shadow:0 0 8px var(--c)}
.segs{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:4px}
.segs i{height:10px;transform:skewX(-30deg);background:rgba(var(--c-rgb),.14)}
.segs i.on{background:var(--c);box-shadow:0 0 6px var(--c)}
.empty{padding:24px;font-size:14px;color:var(--muted)}

/* Lista de presupuestos */
.qtable{width:100%;border-collapse:collapse}
.qtable th{padding:12px 16px;text-align:left;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.14em;color:var(--muted);border-bottom:1px solid rgba(var(--c-rgb),.2)}
.qtable td{padding:14px 16px;border-bottom:1px solid rgba(var(--c-rgb),.12);font-size:14px;vertical-align:middle}
.qtable tr:hover td{background:rgba(var(--c-rgb),.04)}
.qtable select{height:36px;padding:0 10px;background:var(--deep);border:1px solid rgba(var(--c-rgb),.35);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.qtable .acts{display:flex;gap:8px;justify-content:flex-end}
.qtable .acts .ghost{height:36px;padding:0 12px;font-size:12px}
.tscroll{overflow-x:auto}

/* Editor */
.ed{display:flex;gap:32px;align-items:flex-start}
.ed form{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:28px}
.prev{flex:0 0 420px;position:sticky;top:108px;display:flex;flex-direction:column;gap:14px}
.paper{aspect-ratio:794/1123;border:1px solid rgba(var(--c-rgb),.45);background:var(--deep);box-shadow:0 0 40px rgba(var(--c-rgb),.12);padding:26px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.paper .t1{display:flex;justify-content:space-between;align-items:baseline}
.paper .br{font-family:var(--cond);font-style:italic;font-weight:700;font-size:19px}
.paper .br em{font-style:inherit;color:var(--c)}
.paper .meta{font-family:var(--mono);font-size:7.5px;color:var(--muted);text-align:right;line-height:1.5}
.paper .ttl{font-family:var(--cond);font-style:italic;font-weight:700;font-size:26px;line-height:.92;text-transform:uppercase}
.paper .who{font-family:var(--mono);font-size:7.5px;letter-spacing:.08em;color:var(--c)}
.paper .body{flex:1;overflow:hidden;font-size:9px;line-height:1.55;color:var(--soft)}
.paper .body p{margin:0 0 6px}.paper .body ul{margin:0 0 6px;padding-left:13px}
.paper .tot{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid rgba(var(--c-rgb),.3);border-bottom:1px solid rgba(var(--c-rgb),.3)}
.paper .tot b{font-family:var(--cond);font-weight:500;font-size:23px;color:var(--c)}
.paper .cond{font-size:8px;line-height:1.5;color:var(--muted)}
.edbtns{display:flex;gap:10px;flex-wrap:wrap}
.edbtns .ghost{flex:1 1 140px}

@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:1fr}
  .ed{flex-direction:column}
  .prev{position:static;flex-basis:auto;width:100%;max-width:440px}
}
@media (max-width:700px){
  .wrap{padding:0 20px}
  .tabs{display:none}
  .brand .nm img.lg{height:28px}
  .tright{gap:8px}.home{padding:0 10px}
  .brand .tag{display:none}
  #newBtn{padding:0 16px;font-size:20px;letter-spacing:0}#newBtn .nb{display:none}
  .mobtabs a{min-width:0;padding-left:4px!important;padding-right:4px!important;font-size:11px!important;letter-spacing:.08em!important;text-align:center;justify-content:center}
  .top .wrap{height:64px}
  .h1{font-size:40px}
  .g2{grid-template-columns:1fr}
  .qrow{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
  .qrow>span:first-child{display:none}
  .qrow .am{text-align:left}
  .mobtabs{display:flex!important}
}
.mobtabs{display:none;gap:8px;margin:-16px 0 28px}
.mobtabs a{flex:1}
</style>
</head>
<body>

<div class="rail"><i></i></div>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/"><span class="nm">TAPIR<em>MEDIA</em></span><span class="tag">PANEL</span></a>
    <nav class="tabs" id="tabs" aria-label="Panel" hidden>
      <a href="#/" data-t="resumen">RESUMEN</a>
      <a href="#/presupuestos" data-t="presupuestos">PRESUPUESTOS</a>
      <a href="#/salir">SALIR</a>
    </nav>
    <div class="tright">
      <a class="home" href="../"><span aria-hidden="true">←</span> HOME</a>
      <a class="btn cut" id="newBtn" href="#/nuevo" hidden title="Nuevo presupuesto">+<span class="nb"> NUEVO PRESUPUESTO</span></a>
    </div>
  </div>
</header>

<div id="view"></div>

<script>
(function () {
  'use strict';

  // ====== CONFIGURACIÓN ======
  // La misma dirección del motor que en ../index.html y ../eventos/index.html
  var API = 'https://script.google.com/macros/s/AKfycbw82wZ04ynTFD076afLckBRGNM4Wg3KZKANYFpdZ4nXja6NGL3a1cjTu7FNbQCAXZJ_bA/exec';
  // ===========================

  var $ = function (id) { return document.getElementById(id); };
  var view = $('view');
  var TOKEN = '';
  try { TOKEN = localStorage.getItem('tm_panel') || ''; } catch (e) {}
  var QUOTES = null, SUMMARY = null, ED = null, SITE = {};

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(v) { return '$ ' + Math.round(Number(v) || 0).toLocaleString('es-AR'); }
  function dmy(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
  function pad(n) { return String(n).padStart(4, '0'); }

  function call(body) {
    body.token = TOKEN;
    return fetch(API, { method: 'POST', body: JSON.stringify(body) }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.auth && body.action !== 'panel_login') { logout(); throw new Error(d.error); }
      if (d && d.error) throw new Error(d.error);
      return d;
    });
  }
  function logout() { TOKEN = ''; try { localStorage.removeItem('tm_panel'); } catch (e) {} QUOTES = SUMMARY = null; location.hash = '#/'; route(); }

  // Datos de la marca para la vista previa (los mismos de la web)
  fetch(API + '?action=site').then(function (r) { return r.json(); }).then(function (d) {
    SITE = (d && d.site) || {};
    if (SITE.LOGO_URL) document.querySelector('.brand .nm').innerHTML = '<img class="lg" src="' + esc(SITE.LOGO_URL) + '" alt="' + esc(SITE.MARCA || 'Logo') + '">';
    paper();
  }).catch(function () {});

  // ---------- login ----------
  function renderLogin(msg) {
    $('tabs').hidden = true; $('newBtn').hidden = true;
    view.innerHTML = '<section class="login"><form id="loginForm"><span class="corner"></span><span class="c2"></span>' +
      '<div style="display:flex;flex-direction:column;gap:14px"><h1 class="h1">Panel</h1>' +
      '<p style="margin:0;font-size:15px;line-height:1.6;color:var(--muted)">Presupuestos, ventas y visitas. Ingresá la clave del equipo.</p></div>' +
      '<label class="lbl"><span class="k">CLAVE</span><input class="fld" id="clave" type="password" autocomplete="current-password" required style="font-family:var(--mono);font-size:18px;letter-spacing:.2em;height:52px"></label>' +
      (msg ? '<p class="err">' + esc(msg) + '</p>' : '') +
      '<button class="btn cut" type="submit" id="loginBtn" style="height:56px">ENTRAR</button>' +
      '<p class="k" style="margin:0;line-height:1.6">Te recordamos en este navegador por 7 días.</p></form></section>';
    $('clave').focus();
    $('loginForm').onsubmit = function (e) {
      e.preventDefault();
      var b = $('loginBtn'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
      call({ action: 'panel_login', clave: $('clave').value }).then(function (d) {
        TOKEN = d.token; try { localStorage.setItem('tm_panel', TOKEN); } catch (x) {}
        route();
      }).catch(function (err) { renderLogin(err.message); });
    };
  }

  function shell(tab) {
    $('tabs').hidden = false; $('newBtn').hidden = false;
    document.querySelectorAll('#tabs a[data-t]').forEach(function (a) { if (a.getAttribute('data-t') === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  }
  function loading(t) { view.innerHTML = '<main><div class="wrap"><p class="kc"><span class="spin"></span>&nbsp; ' + (t || 'CARGANDO…') + '</p></div></main>'; }
  function failed(err) { view.innerHTML = '<main><div class="wrap"><p class="err">' + esc(err.message || err) + '</p></div></main>'; }
  var mobtabs = '<div class="mobtabs"><a class="ghost cutsm" href="#/">RESUMEN</a><a class="ghost cutsm" href="#/presupuestos">PRESUPUESTOS</a><a class="ghost cutsm" href="#/salir">SALIR</a></div>';

  // ---------- resumen ----------
  function renderSummary() {
    shell('resumen');
    if (!SUMMARY) { loading(); call({ action: 'panel_resumen' }).then(function (d) { SUMMARY = d; renderSummary(); }).catch(failed); return; }
    var s = SUMMARY;
    var max = Math.max.apply(null, s.visits.map(function (v) { return v.n; }).concat([1]));
    var top = s.visits.reduce(function (a, v, i) { return v.n > s.visits[a].n ? i : a; }, 0);
    var sec = { home: 'Portada', eventos: 'Eventos', galeria: 'Galería', clips: 'Clips' };
    var phMax = Math.max.apply(null, s.byPh.map(function (p) { return p.amount; }).concat([1]));

      if (/^[-•*]\s+/.test(l)) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + esc(l.replace(/^[-•*]\s+/, '')) + '</li>'; }
      else { if (inList) { html += '</ul>'; inList = false; } html += /^incluye:?$/i.test(l) ? '<p style="font-family:var(--mono);font-size:7px;letter-spacing:.14em;color:var(--c)">INCLUYE</p>' : '<p>' + esc(l) + '</p>'; }
    });
    if (inList) html += '</ul>';
    var brand = String(SITE.MARCA || 'TAPIRMEDIA').toUpperCase(), k = brand.indexOf('MEDIA');
    p.innerHTML = '<div class="t1"><span class="br">' + (SITE.LOGO_URL ? '<img src="' + esc(SITE.LOGO_URL) + '" alt="">' : k > 0 ? esc(brand.slice(0, k)) + '<em>' + esc(brand.slice(k)) + '</em>' : esc(brand)) + '</span>' +
      '<span class="meta">PRESUPUESTO N.º ' + (e.n ? pad(e.n) : '----') + '<br>EMITIDO ' + f(created) + '<br>VÁLIDO HASTA ' + f(until) + '</span></div>' +
      '<span style="height:1px;background:rgba(var(--c-rgb),.4)"></span>' +
      '<span class="ttl">' + esc(e.evento || 'Presupuesto') + '</span>' +

      (e.dirigido ? '<span style="font-size:8px;color:var(--soft)">Dirigido a: ' + esc(e.dirigido) + '</span>' : '') +
      '<div class="body">' + (html || '<p style="color:var(--muted)">El texto del presupuesto aparece acá.</p>') +
        (itemLines(e.items).length ? '<p style="font-family:var(--mono);font-size:7px;letter-spacing:.14em;color:var(--c);margin-top:8px">DETALLE</p>' +
          itemLines(e.items).map(function (x) { return '<div style="display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(var(--c-rgb),.15);padding:2px 0"><span style="font-family:var(--mono);font-size:6.5px;color:var(--muted)">' + esc(x[0]).toUpperCase() + '</span><span>' + esc(x[1]) + '</span></div>'; }).join('') : '') +
      (refList(e.refs).length ? '<p style="font-family:var(--mono);font-size:7px;letter-spacing:.14em;color:var(--c);margin-top:8px">REFERENCIAS</p>' +

      '</div>' +
      '<div class="tot"><span class="k" style="font-size:7px">TOTAL</span><b>' + money(e.precio) + '</b></div>' +
      '<span class="cond">Forma de pago: ' + esc(e.pago || 'a convenir') + (e.redacta ? '<br>Redactó: ' + esc(e.redacta) : '') + '</span>' +
      '<span class="cond" style="display:flex;justify-content:space-between;gap:8px;border-top:1px solid rgba(var(--c-rgb),.2);padding-top:6px"><span>' +
        esc(SITE.NOMBRE_VISIBLE || 'Tapir Media') + (SITE.MAIL_CONTACTO ? '<br>' + esc(SITE.MAIL_CONTACTO) : '') + '</span><span style="text-align:right">' +
        (SITE.INSTAGRAM ? 'Instagram ' + esc(SITE.INSTAGRAM) : '') + '</span></span>';
  }

  // ---------- PDF (una sola pagina A4, fondo oscuro, armado en el navegador) ----------
  var ISSUER = null, LIBS = null;
  function loadScript(src) {
    return new Promise(function (ok, ko) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function () { ko(new Error('No cargó ' + src)); }; document.head.appendChild(s); });
  }
  function pdfLibs() {
    if (!LIBS) LIBS = Promise.all([
      window.html2canvas ? 0 : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
      window.jspdf ? 0 : loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
    ]).catch(function (x) { LIBS = null; throw x; });
    return LIBS;
  }
  function issuer() {
    if (ISSUER) return Promise.resolve(ISSUER);
    return call({ action: 'panel_emisor' }).then(function (d) { ISSUER = d; return d; });
  }
  function dmy(s) { var d = new Date(String(s).slice(0, 10) + 'T12:00:00'); return isNaN(d) ? '' : String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); }
  function pdfHtml(q, I) {
    var body = '', inList = false;
    String(q.texto || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean).forEach(function (l) {
      if (/^[-•*]\s+/.test(l)) { if (!inList) { body += '<ul>'; inList = true; } body += '<li><i></i><span>' + esc(l.replace(/^[-•*]\s+/, '')) + '</span></li>'; }
      else { if (inList) { body += '</ul>'; inList = false; } body += /^incluye:?$/i.test(l) ? '<p class="qk">INCLUYE</p>' : '<p>' + esc(l) + '</p>'; }
    });
    if (inList) body += '</ul>';
    var brand = String(SITE.MARCA || 'TAPIRMEDIA').toUpperCase(), k = brand.indexOf('MEDIA');
    var row = function (a, b) { return b ? '<span class="qm">' + a + '</span><span>' + esc(b) + '</span>' : ''; };
    var items = itemLines(q.items || {});
    var refs = refList(q.refs);
    return '<div class="qin">' +
      '<span class="qcn qtl"></span><span class="qcn qbr"></span>' +
      '<header><span class="qbrand">' + (I.logo ? '<img src="' + I.logo + '" alt="">' : k > 0 ? esc(brand.slice(0, k)) + '<em>' + esc(brand.slice(k)) + '</em>' : esc(brand)) + '</span>' +
        '<span class="qm qr"><b>PRESUPUESTO N.º ' + pad(q.n) + '</b><br>EMITIDO ' + dmy(q.creado) + '<br>VÁLIDO HASTA ' + dmy(q.vence) + '</span></header>' +
      '<span class="qline"></span>' +
      '<h1>' + esc(q.evento || 'Presupuesto') + '</h1>' +
      '<div class="qdt">' + row('CLIENTE', q.cliente) + row('DIRIGIDO A', q.dirigido) + row('FECHA', q.fecha) + row('LUGAR', q.lugar) + '</div>' +
      '<section class="qbox"><p class="qk">// PROPUESTA</p>' + body +
        (items.length ? '<p class="qk">// DETALLE</p><div class="qit">' + items.map(function (x) { return '<span class="qm">' + esc(x[0]).toUpperCase() + '</span><span>' + esc(x[1]) + '</span>'; }).join('') + '</div>' : '') +
        (refs.length ? '<p class="qk">// REFERENCIAS</p><div class="qrf">' + refs.map(function (x) { return '<a data-u="' + esc(x[1]) + '">' + esc(x[0] || x[1].replace(/^https?:\/\//, '')) + (x[0] ? '<small>' + esc(x[1].replace(/^https?:\/\//, '')) + '</small>' : '') + '</a>'; }).join('') + '</div>' : '') +
      '</section>' +
      '<div class="qtot"><div><span class="qm">FORMA DE PAGO</span><span>' + esc(q.pago || 'A convenir') + '</span>' + (q.redacta ? '<span class="qm" style="margin-top:.9em">REDACTÓ</span><span>' + esc(q.redacta) + '</span>' : '') + '</div>' +
        '<div class="qr"><span class="qm">TOTAL</span><b>' + money(q.precio) + '</b></div></div>' +
      '<footer><span class="qm"><span class="qc">EMITE</span><br><b>' + esc(I.name) + '</b>' + I.lines.map(function (x) { return '<br>' + esc(x); }).join('') + '</span>' +
        '<span class="qm qr"><span class="qc">REDES</span>' + I.socials.map(function (x) { return '<br>' + esc(x); }).join('') + '</span></footer>' +
    '</div>';
  }
  var PDF_CSS = '#pdfpg{position:fixed;left:-12000px;top:0;width:794px;height:1123px;overflow:hidden;background:#1F1C19;color:#EEE9E4;font-family:Barlow,Arial,sans-serif;font-weight:300}' +
    '#pdfpg .qin{position:relative;box-sizing:border-box;width:794px;min-height:1123px;padding:3.4em 3.8em 3em;display:flex;flex-direction:column;gap:1.25em}' +
    '#pdfpg .qcn{position:absolute;width:26px;height:26px;border:0 solid #5CE6FF}#pdfpg .qcn.qtl{top:26px;left:26px;border-top-width:2px;border-left-width:2px}#pdfpg .qcn.qbr{bottom:26px;right:26px;border-bottom-width:2px;border-right-width:2px}' +
    '#pdfpg header{display:flex;justify-content:space-between;align-items:flex-start;gap:2em}' +
    '#pdfpg .qbrand{font-family:"Barlow Condensed",Arial,sans-serif;font-style:italic;font-weight:700;font-size:2.4em;line-height:1;letter-spacing:.02em}#pdfpg .qbrand img{display:block;height:3em;width:auto;max-width:22em}#pdfpg .qbrand em{font-style:inherit;color:#5CE6FF;text-shadow:0 0 14px rgba(92,230,255,.6)}' +
    '#pdfpg .qm{font-family:"JetBrains Mono",monospace;font-size:.66em;letter-spacing:.14em;color:#B3AAA2;line-height:1.75}#pdfpg .qm b{color:#5CE6FF;font-weight:400}#pdfpg .qr{text-align:right}#pdfpg .qc{color:#5CE6FF}' +
    '#pdfpg .qline{height:1px;background:#5CE6FF;box-shadow:0 0 8px rgba(92,230,255,.6)}' +
    '#pdfpg h1{margin:0;font-family:"Barlow Condensed",Arial,sans-serif;font-style:italic;font-weight:700;font-size:3.3em;line-height:.95;text-transform:uppercase}' +
    '#pdfpg .qdt{display:grid;grid-template-columns:8.5em 1fr;row-gap:.35em;align-items:baseline;font-size:.9em}#pdfpg .qdt .qm{font-size:.72em}' +
    '#pdfpg .qbox{padding:1.3em 1.5em;border:1px solid rgba(92,230,255,.32);background:rgba(14,12,11,.45);display:flex;flex-direction:column;gap:.55em}' +
    '#pdfpg .qbox p{margin:0;font-size:.9em;line-height:1.55;color:#D6CFC8}#pdfpg .qbox p.qk{font-family:"JetBrains Mono",monospace;font-size:.64em;letter-spacing:.16em;color:#5CE6FF;margin-top:.5em}#pdfpg .qbox p.qk:first-child{margin-top:0}' +
    '#pdfpg ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.35em}#pdfpg li{display:flex;gap:.8em;font-size:.88em;line-height:1.45}#pdfpg li i{flex:none;width:.9em;height:2px;margin-top:.7em;background:#5CE6FF}' +
    '#pdfpg .qit{display:grid;grid-template-columns:13em 1fr;font-size:.84em}#pdfpg .qit>*{padding:.4em 0;border-bottom:1px solid rgba(92,230,255,.14)}#pdfpg .qit .qm{font-size:.76em;line-height:1.9}' +
    '#pdfpg .qrf{display:flex;flex-direction:column;gap:.45em}#pdfpg .qrf a{color:#5CE6FF;font-size:.84em;line-height:1.35}#pdfpg .qrf small{display:block;font-family:"JetBrains Mono",monospace;font-size:.78em;color:#B3AAA2}' +
    '#pdfpg .qtot{display:flex;justify-content:space-between;align-items:flex-end;gap:2em;padding:1.1em 0;border-top:1px solid rgba(92,230,255,.4);border-bottom:1px solid rgba(92,230,255,.4)}#pdfpg .qtot>div{display:flex;flex-direction:column;font-size:.88em}' +
    '#pdfpg .qtot b{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:500;font-size:3.6em;line-height:.95;color:#5CE6FF;text-shadow:0 0 18px rgba(92,230,255,.45)}' +
    '#pdfpg footer{margin-top:auto;display:flex;justify-content:space-between;gap:2em;padding-top:.4em}#pdfpg footer .qm{font-size:.62em}#pdfpg footer .qm b{color:#EEE9E4}';
  function makePdf(q) {
    return Promise.all([pdfLibs(), issuer(), document.fonts ? document.fonts.ready : 0]).then(function (r) {
      var I = r[1];
      if (!$('pdfcss')) { var st = document.createElement('style'); st.id = 'pdfcss'; st.textContent = PDF_CSS; document.head.appendChild(st); }
      var pg = document.createElement('div'); pg.id = 'pdfpg'; pg.innerHTML = pdfHtml(q, I); document.body.appendChild(pg);
      var inn = pg.firstChild;
      // Achica la letra hasta que entre todo en una pagina.
      var size = 16;
      inn.style.minHeight = '0';
      while (size > 9 && inn.offsetHeight > 1123) { size -= .5; pg.style.fontSize = size + 'px'; }
      if (inn.offsetHeight > 1123) { var sc = 1123 / inn.offsetHeight; inn.style.transformOrigin = '0 0'; inn.style.transform = 'scale(' + sc + ')'; inn.style.width = (794 / sc) + 'px'; }
      else inn.style.minHeight = '1123px';
      var box = pg.getBoundingClientRect();
      var links = [].slice.call(pg.querySelectorAll('[data-u]')).map(function (a) { var b = a.getBoundingClientRect(); return { u: a.getAttribute('data-u'), x: b.left - box.left, y: b.top - box.top, w: b.width, h: b.height }; });
      return window.html2canvas(pg, { scale: 2, backgroundColor: '#1F1C19', logging: false, width: 794, height: 1123, x: 0, y: 0, scrollX: 0, scrollY: 0, windowWidth: 1400, windowHeight: 1200,
        onclone: function (d) { var c = d.getElementById('pdfpg'); c.style.left = '0px'; c.style.top = '0px'; } }).then(function (cv) {
        pg.remove();
        var J = window.jspdf.jsPDF, doc = new J({ unit: 'pt', format: 'a4', compress: true }), k = 595.28 / 794;
        doc.setProperties({ title: 'Presupuesto ' + pad(q.n) + ' · ' + (q.evento || q.cliente || ''), author: SITE.NOMBRE_VISIBLE || 'Tapir Media' });
        doc.addImage(cv.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 595.28, 841.89);
        links.forEach(function (l) { doc.link(l.x * k, l.y * k, l.w * k, l.h * k, { url: l.u }); });
        return doc.output('datauristring').split(',')[1];
      }, function (x) { pg.remove(); throw x; });
    });
  }

  // ---------- rutas ----------
  function route() {
    var h = location.hash.replace(/^#\/?/, '');
    if (h === 'salir') { logout(); return; }
    if (!TOKEN) { renderLogin(); return; }
    if (h === 'presupuestos') renderList();
    else if (h === 'nuevo') { if (ED && ED.id) ED = null; renderEditor(''); }
    else if (/^p\//.test(h)) renderEditor(h.slice(2));
    else renderSummary();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
